<html lang="es">

    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="PUP'S Pet Shop y Grooming en Guatemala. Grooming, veterinaria y tienda para tu mascota. Reserva tu cita en línea."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_GT" />
    <meta property="og:site_name" content="PUP'S Pet Shop y Grooming" />
    <meta property="og:title" content="PUP'S · Grooming, veterinaria y pet shop" />

    <meta name="twitter:card" content="summary_large_image" />
    <title>PUP'S · Pet Shop y Grooming</title>
    <link rel="icon" href="/logo.png" />
    <script>
      try {
        var t = localStorage.getItem('pups-theme')
        var panel = /^\/(admin|login)/.test(location.pathname)
        var dark = panel && (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
