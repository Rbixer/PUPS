<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1c1f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PUP'S" />
    <meta name="application-name" content="PUP'S" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta
      name="description"
      content="PUP'S Pet Shop y Grooming. Citas, fichas de mascotas, caja y reportes en un solo panel. Funciona sin conexión."
    />
    <meta property="og:title" content="PUP'S · Pet Shop y Grooming" />
    <meta property="og:description" content="Citas, fichas, caja y equipo en un solo panel." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <title>PUP'S · Pet Shop y Grooming</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pups-theme')
          var dark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#0f0e10' : '#1d1c1f'
        } catch (error) {}
      })()
    </script>
    <style>
      html { background: #f6f2ec; }
      html[data-theme='dark'] { background: #131113; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: inherit; }
      #boot img { width: 88px; animation: bootfloat 2.2s ease-in-out infinite; }
      @keyframes bootfloat { 50% { transform: translateY(-8px); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><img src="/logo.png" alt="PUP'S" /></div>
    </div>
    <noscript>PUP'S necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
